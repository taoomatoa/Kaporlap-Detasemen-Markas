<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pendataan Kaporlap</title>
    <style>
        :root {
            --primary-color: #00A8FF;
            --secondary-color: #0077B6;
            --bg-color: #E0F7FA;
            --card-bg: #FFFFFF;
            --text-color: #023E8A;
            --success-color: #2e7d32;
            --danger-color: #c62828;
            --warning-color: #ef6c00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .mobile-container {
            width: 100%; max-width: 480px; background-color: var(--card-bg);
            min-height: 100vh; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; position: relative;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white; padding: 20px; text-align: center;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }

        .header h2 { font-size: 1.2rem; margin-bottom: 5px; }
        .content { padding: 20px; flex: 1; }

        .card {
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #BEE3F8; margin-bottom: 15px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-color); font-weight: 600; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #90E0EF; border-radius: 8px; font-size: 0.95rem; outline: none; }

        .btn {
            width: 100%; padding: 12px; background-color: var(--primary-color);
            color: white; border: none; border-radius: 8px; font-size: 0.95rem;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .btn-sm { padding: 6px 12px; font-size: 0.8rem; width: auto; }
        .btn-success { background-color: var(--success-color); }
        .btn-outline { background-color: transparent; color: var(--primary-color); border: 2px solid var(--primary-color); margin-top: 10px; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .menu-item {
            background: #E0F7FA; border: 1px solid #90E0EF; padding: 15px 10px;
            border-radius: 12px; text-align: center; cursor: pointer;
            color: var(--text-color); font-weight: bold; font-size: 0.85rem;
        }

        .tab-menu { display: flex; gap: 6px; margin-bottom: 15px; }
        .tab-menu button {
            flex: 1; padding: 8px 4px; border: 1px solid var(--primary-color);
            background: white; color: var(--primary-color); border-radius: 6px;
            cursor: pointer; font-size: 0.78rem; font-weight: bold;
        }
        .tab-menu button.active { background: var(--primary-color); color: white; }

        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: white; }
        .badge-success { background-color: var(--success-color); }
        .badge-warning { background-color: var(--warning-color); }

        .hidden { display: none !important; }
        .user-info { font-size: 0.85rem; opacity: 0.9; }

        .member-card {
            border: 1px solid #E0E0E0; border-radius: 8px; padding: 12px;
            margin-bottom: 10px; background: #FAFAFA; display: flex;
            flex-direction: column; gap: 8px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; z-index: 999;
        }
        .modal-body { width: 90%; max-width: 400px; }

        .btn-loading { position: relative; pointer-events: none; opacity: 0.8; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 380px; width: calc(100% - 40px); }
        .toast { padding: 12px 16px; border-radius: 8px; background: #333; color: white; margin-bottom: 8px; opacity: 0; transition: opacity 0.3s; font-size: 0.85rem; }
        .toast.show { opacity: 1; }
        .toast-success { background: var(--success-color); }
        .toast-error { background: var(--danger-color); }
        .toast-info { background: var(--secondary-color); }
    </style>
</head>
<body>

<div id="toast-container" class="toast-container"></div>

<div class="mobile-container">
    <div class="header">
        <h2>PENDATAAN KAPORLAP</h2>
        <div id="userInfo" class="user-info">Aplikasi Internal Denma Paspampres</div>
    </div>

    <div class="content">
        <!-- 1. FORM LOGIN -->
        <div id="loginCard" class="card">
            <h3 style="color: var(--text-color); margin-bottom: 15px; text-align: center;">Login Sistem</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginNrp">NRP / Username</label>
                    <input type="text" id="loginNrp" class="form-control" placeholder="Masukkan NRP" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan Password" required>
                </div>
                <button type="submit" id="btnLogin" class="btn">MASUK</button>
            </form>
        </div>
        
        <!-- 2. DASHBOARD ADMIN -->
        <div id="adminPanel" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--text-color); font-size: 1.1rem;">Kontrol Pengambilan</h3>
                <button type="button" class="btn btn-sm" onclick="loadAdminData()" style="width: auto; background-color: var(--secondary-color);">🔄 Refresh</button>
            </div>
            
            <div class="form-group" style="margin-bottom: 12px;">
                <input type="text" id="adminSearchInput" class="form-control" placeholder="🔍 Cari NRP atau Nama..." onkeyup="filterAdminList()">
            </div>

            <div class="tab-menu">
                <button id="tabSemuaBtn" class="active" onclick="switchAdminTab('Semua')">Semua Data</button>
                <button id="tabBelumBtn" onclick="switchAdminTab('Belum Lengkap')">Belum Lengkap</button>
                <button id="tabSudahBtn" onclick="switchAdminTab('Sudah Lengkap')">Sudah Lengkap</button>
            </div>
            
            <div id="adminListContainer">
                <p style="text-align: center; color: #666;">Memuat data...</p>
            </div>
            
            <button class="btn btn-outline" style="margin-top:20px;" onclick="logout()">Keluar (Logout)</button>
        </div>

        <!-- 3. MENU USER -->
        <div id="mainMenu" class="hidden">
            <div class="menu-grid">
                <div class="menu-item" onclick="showForm()">
                    <div style="font-size: 1.5rem;">👕</div>
                    <div>Input Ukuran</div>
                </div>
                <div class="menu-item" onclick="loadMyData()">
                    <div style="font-size: 1.5rem;">📋</div>
                    <div>Data & Status Saya</div>
                </div>
            </div>
            <button class="btn btn-outline" style="margin-top:20px;" onclick="logout()">Keluar (Logout)</button>
        </div>

        <!-- 4. FORM INPUT UKURAN -->
        <div id="formPage" class="card hidden">
            <h3 style="color: var(--text-color); margin-bottom: 15px;">Formulir Ukuran Kaporlap</h3>
            <form id="kaporlapForm">
                <div class="form-group">
                    <label for="pangkat">Pangkat</label>
                    <input type="text" id="pangkat" class="form-control" placeholder="Contoh: Serda / Sertu / Kapten" required>
                </div>
                <div class="form-group">
                    <label for="ukuranPDL">Ukuran Baju PDL</label>
                    <select id="ukuranPDL" class="form-control" required>
                        <option value="">-- Pilih Ukuran --</option>
                        <option value="K1">K1 (Kecil 1)</option>
                        <option value="K2">K2 (Kecil 2)</option>
                        <option value="K3">K3 (Kecil 3)</option>
                        <option value="S1">S1 (Sedang 1)</option>
                        <option value="S2">S2 (Sedang 2)</option>
                        <option value="S3">S3 (Sedang 3)</option>
                        <option value="B1">B1 (Besar 1)</option>
                        <option value="B2">B2 (Besar 2)</option>
                        <option value="B3">B3 (Besar 3)</option>
                        <option value="EB 1">EB 1 (Ekstra Besar 1)</option>
                        <option value="EB 2">EB 2 (Ekstra Besar 2)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ukuranSepatu">Ukuran Sepatu PDL</label>
                    <input type="number" id="ukuranSepatu" class="form-control" min="38" max="47" placeholder="Contoh: 42" required>
                </div>
                <div class="form-group">
                    <label for="ukuranSepatuOlahraga">Ukuran Sepatu Olah Raga</label>
                    <input type="number" id="ukuranSepatuOlahraga" class="form-control" min="38" max="47" placeholder="Contoh: 42" required>
                </div>
                <div class="form-group">
                    <label for="ukuranSepatuTac">Ukuran Sepatu Tactical</label>
                    <input type="number" id="ukuranSepatuTac" class="form-control" min="38" max="47" placeholder="Contoh: 42" required>
                </div>
                <div class="form-group">
                    <label for="ukuranTutupKepala">Ukuran Topi / Pet / Baret</label>
                    <input type="number" id="ukuranTopi" class="form-control" min="53" max="62" placeholder="Contoh: 57" required>
                </div>
                <div class="form-group">
                    <label for="ukuranPDHS">Ukuran Baju Tactical</label>
                    <select id="ukuranPDHS" class="form-control" required>
                        <option value="">-- Pilih Ukuran --</option>
                        <option value="K">K (Kecil)</option>
                        <option value="S">S (Sedang)</option>
                        <option value="L">L (Besar)</option>
                        <option value="XL">XL (Ekstra Besar)</option>
                        <option value="XXL">XXL (Ekstra-Ekstra Besar)</option>
                        <option value="XL">XXXL (Ekstra-Ekstra-Ekstra Besar)</option>
                    </select>
                </div>
                <button type="submit" id="btnSimpan" class="btn">SIMPAN DATA</button>
                <button type="button" class="btn btn-outline" onclick="showMenu()">KEMBALI</button>
            </form>
        </div>

        <!-- 5. TAMPILAN STATUS USER -->
        <div id="dataPage" class="card hidden">
            <h3 style="color: var(--text-color); margin-bottom: 15px;">Status & Ukuran Saya</h3>
            <div id="userStatusContainer" style="margin-bottom: 15px;"></div>
            <div id="dataContainer"></div>
            <button type="button" class="btn btn-outline" style="margin-top: 15px;" onclick="showMenu()">KEMBALI KE MENU</button>
        </div>
    </div>
</div>

<!-- MODAL CHECKLIST ITEM ADMIN -->
<div id="itemModal" class="modal-overlay hidden">
    <div class="card modal-body">
        <h3 id="modalMemberName" style="color: var(--text-color); margin-bottom: 2px;">-</h3>
        <p id="modalMemberNrp" style="font-size: 0.8rem; color: #666; margin-bottom: 15px;">-</p>
        
        <form id="checklistForm">
            <input type="hidden" id="modalTargetNrp">
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; font-size: 0.9rem;">
                <label><input type="checkbox" name="kaporlapItem" value="Baju PDL"> Baju PDL (<strong id="sizePDL">-</strong>)</label>
                <label><input type="checkbox" name="kaporlapItem" value="Sepatu PDL"> Sepatu PDL (<strong id="sizeSepatuPDL">-</strong>)</label>
                <label><input type="checkbox" name="kaporlapItem" value="Sepatu Olah Raga"> Sepatu Olah Raga (<strong id="sizeSepatuOR">-</strong>)</label>
                <label><input type="checkbox" name="kaporlapItem" value="Sepatu Tactical"> Sepatu Tactical (<strong id="sizeSepatuTac">-</strong>)</label>
                <label><input type="checkbox" name="kaporlapItem" value="Topi"> Topi / Pet / Baret (<strong id="sizeTopi">-</strong>)</label>
                <label><input type="checkbox" name="kaporlapItem" value="Baju Tactical"> Baju Tactical (<strong id="sizeBajuTac">-</strong>)</label>
            </div>

            <button type="button" class="btn btn-success" onclick="saveChecklist()">SIMPAN PERUBAHAN</button>
            <button type="button" class="btn btn-outline" onclick="closeItemModal()">BATAL</button>
        </form>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP DEPLOYMENT GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjrDv7bROdQkV64tzHx_1h7MCM1CgV3w6WHGk95lruwfJoPVEaFLsn4v33Io5F9q0N/exec";
    
    let currentSession = { nrp: "", nama: "", role: "" };
    let allAdminData = [];
    let currentAdminFilter = "Semua";

    document.getElementById('loginForm').addEventListener('submit', handleLogin);
    document.getElementById('kaporlapForm').addEventListener('submit', handleSimpanUkuran);

    async function postToAppsScript(payload) {
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        return await response.json();
    }

    async function handleLogin(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('btnLogin');
        const nrp = document.getElementById('loginNrp').value.trim();
        const password = document.getElementById('loginPassword').value;

        setButtonLoading(submitBtn, true, 'Sedang Masuk...');

        try {
            const result = await postToAppsScript({ action: 'login', nrp: nrp, password: password });

            if (result.status === 'success') {
                currentSession.nrp = nrp;
                currentSession.nama = result.nama;
                currentSession.role = result.role;

                document.getElementById('userInfo').innerText = `${result.nama} (${result.role})`;
                showToast('Login berhasil!', 'success');

                document.getElementById('loginCard').classList.add('hidden');

                if (result.role === 'Admin') {
                    document.getElementById('adminPanel').classList.remove('hidden');
                    loadAdminData();
                } else {
                    showMenu();
                }
            } else {
                showToast(result.message || 'NRP atau Password salah!', 'error');
            }
        } catch (err) {
            showToast('Gagal terhubung ke server!', 'error');
        } finally {
            setButtonLoading(submitBtn, false);
        }
    }

    async function loadAdminData() {
        const container = document.getElementById('adminListContainer');
        container.innerHTML = '<p style="text-align: center; color: #666;">Memuat data terbaru...</p>';

        try {
            const res = await postToAppsScript({ action: 'get_status_admin' });
            if (res.status === 'success') {
                allAdminData = res.data;
                renderAdminList();
            } else {
                container.innerHTML = '<p style="text-align: center; color: red;">Gagal mengambil data.</p>';
            }
        } catch (err) {
            container.innerHTML = '<p style="text-align: center; color: red;">Gagal memuat data dari server.</p>';
        }
    }

    function switchAdminTab(filter) {
        currentAdminFilter = filter;
        document.getElementById('tabSemuaBtn').classList.toggle('active', filter === 'Semua');
        document.getElementById('tabBelumBtn').classList.toggle('active', filter === 'Belum Lengkap');
        document.getElementById('tabSudahBtn').classList.toggle('active', filter === 'Sudah Lengkap');
        renderAdminList();
    }

    function filterAdminList() { renderAdminList(); }

    function renderAdminList() {
        const container = document.getElementById('adminListContainer');
        const searchQuery = document.getElementById('adminSearchInput').value.toLowerCase().trim();

        const filtered = allAdminData.filter(item => {
            const takenCount = item.itemsTaken ? item.itemsTaken.length : 0;
            const isLengkap = takenCount === 6;
            
            let matchStatus = true;
            if (currentAdminFilter === 'Belum Lengkap') matchStatus = !isLengkap;
            else if (currentAdminFilter === 'Sudah Lengkap') matchStatus = isLengkap;

            const matchQuery = item.nrp.toLowerCase().includes(searchQuery) || 
                               item.nama.toLowerCase().includes(searchQuery);
            return matchStatus && matchQuery;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #888; margin: 20px 0;">Tidak ada data yang cocok.</p>`;
            return;
        }

        let html = '';
        filtered.forEach(item => {
            const takenCount = item.itemsTaken ? item.itemsTaken.length : 0;
            html += `
                <div class="member-card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-weight: bold; color: var(--text-color);">${item.nama || '-'}</div>
                            <div style="font-size: 0.8rem; color: #666;">NRP: <strong>${item.nrp}</strong> | ${item.pangkat || '-'}</div>
                        </div>
                        <span class="status-badge ${takenCount === 6 ? 'badge-success' : 'badge-warning'}">
                            ${takenCount}/6 Diambil
                        </span>
                    </div>
                    
                    <div style="font-size: 0.75rem; color: #444;">
                        <strong>Terambil:</strong> ${item.itemsTaken && item.itemsTaken.length > 0 ? item.itemsTaken.join(', ') : 'Belum ada'}
                    </div>

                    <button class="btn btn-sm" onclick="openItemModal('${item.nrp}')" style="width: 100%; margin-top: 5px;">
                        📋 Kelola Pengambilan
                    </button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function openItemModal(nrp) {
        const member = allAdminData.find(m => m.nrp.toString() === nrp.toString());
        if (!member) return;

        document.getElementById('modalTargetNrp').value = member.nrp;
        document.getElementById('modalMemberName').innerText = member.nama;
        document.getElementById('modalMemberNrp').innerText = `NRP: ${member.nrp} | ${member.pangkat}`;

        document.getElementById('sizePDL').innerText = member.pdl || '-';
        document.getElementById('sizeSepatuPDL').innerText = member.sepatuPDL || '-';
        document.getElementById('sizeSepatuOR').innerText = member.sepatuOR || '-';
        document.getElementById('sizeSepatuTac').innerText = member.sepatuTac || '-';
        document.getElementById('sizeTopi').innerText = member.topi || '-';
        document.getElementById('sizeBajuTac').innerText = member.bajuTac || '-';

        const checkboxes = document.querySelectorAll('input[name="kaporlapItem"]');
        checkboxes.forEach(cb => {
            cb.checked = member.itemsTaken && member.itemsTaken.includes(cb.value);
        });

        document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeItemModal() {
        document.getElementById('itemModal').classList.add('hidden');
    }

    async function saveChecklist() {
        const nrp = document.getElementById('modalTargetNrp').value;
        const checkboxes = document.querySelectorAll('input[name="kaporlapItem"]:checked');
        const selectedItems = Array.from(checkboxes).map(cb => cb.value);

        try {
            showToast('Menyimpan...', 'info');
            const res = await postToAppsScript({
                action: 'update_items_pengambilan',
                targetNrp: nrp,
                itemsTaken: selectedItems,
                adminName: currentSession.nama
            });

            if (res.status === 'success') {
                showToast(res.message, 'success');
                closeItemModal();
                loadAdminData();
            } else {
                showToast(res.message, 'error');
            }
        } catch (err) {
            showToast('Gagal memperbarui data', 'error');
        }
    }

    async function handleSimpanUkuran(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('btnSimpan');
        setButtonLoading(submitBtn, true, 'Menyimpan...');

        const payload = {
            action: 'simpan_kaporlap',
            nrp: currentSession.nrp,
            nama: currentSession.nama,
            pangkat: document.getElementById('pangkat').value,
            ukuranPDL: document.getElementById('ukuranPDL').value,
            ukuranSepatu: document.getElementById('ukuranSepatu').value,
            ukuranSepatuOlahraga: document.getElementById('ukuranSepatuOlahraga').value,
            ukuranSepatuTac: document.getElementById('ukuranSepatuTac').value,
            ukuranTopi: document.getElementById('ukuranTopi').value,
            ukuranPDHS: document.getElementById('ukuranPDHS').value
        };

        try {
            const res = await postToAppsScript(payload);
            if (res.status === 'success') {
                showToast(res.message, 'success');
                document.getElementById('kaporlapForm').reset();
                showMenu();
            } else {
                showToast(res.message || 'Gagal menyimpan data.', 'error');
            }
        } catch (err) {
            showToast('Gagal menyimpan data!', 'error');
        } finally {
            setButtonLoading(submitBtn, false);
        }
    }

    async function loadMyData() {
        showDisplayPage();
        const container = document.getElementById('dataContainer');
        const statusContainer = document.getElementById('userStatusContainer');
        container.innerHTML = '<p style="text-align:center; color:#666;">Memuat data...</p>';

        try {
            const res = await postToAppsScript({ action: 'get_my_data', nrp: currentSession.nrp });
            if (res.status === 'success') {
                const st = res.statusInfo;
                statusContainer.innerHTML = `
                    <div style="padding: 12px; border-radius: 8px; background: #E8F5E9; border: 1px solid #A5D6A7;">
                        <div style="font-size:0.85rem;">Progres Pengambilan:</div>
                        <span class="status-badge badge-success">${st.status}</span>
                        ${st.tglDiambil !== '-' ? `<div style="font-size:0.75rem; margin-top:5px; color:#555;">Terakhir diperbarui: ${st.tglDiambil}<br>Petugas: ${st.petugas}</div>` : ''}
                    </div>
                `;

                if (res.data.length > 0) {
                    let html = '';
                    res.data.forEach((item) => {
                        html += `
                            <div style="border: 1px solid #90E0EF; border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #F0F9FF;">
                                <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:0.85rem;">
                                    <div><strong>PDL:</strong> ${item.ukuranPDL}</div>
                                    <div><strong>Sepatu PDL:</strong> ${item.ukuranSepatu}</div>
                                    <div><strong>Sepatu OR:</strong> ${item.ukuranSepatuOlahraga}</div>
                                    <div><strong>Sepatu Tac:</strong> ${item.ukuranSepatuTac}</div>
                                    <div><strong>Topi:</strong> ${item.ukuranTopi}</div>
                                    <div><strong>Baju Tac:</strong> ${item.ukuranPDHS}</div>
                                </div>
                            </div>`;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="text-align:center; color:#888;">Belum ada data ukuran tersimpan.</p>';
                }
            }
        } catch (err) {
            container.innerHTML = '<p style="text-align:center; color:red;">Gagal memuat data.</p>';
        }
    }

    function setButtonLoading(button, isLoading, textLoading = 'Memproses...') {
        if (!button) return;
        if (isLoading) {
            button.dataset.originalText = button.innerHTML;
            button.classList.add('btn-loading');
            button.disabled = true;
            button.innerHTML = `<span class="spinner"></span> <span>${textLoading}</span>`;
        } else {
            button.classList.remove('btn-loading');
            button.disabled = false;
            if (button.dataset.originalText) button.innerHTML = button.dataset.originalText;
        }
    }

    function showDisplayPage() {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('formPage').classList.add('hidden');
        document.getElementById('dataPage').classList.remove('hidden');
    }

    function showMenu() {
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('formPage').classList.add('hidden');
        document.getElementById('dataPage').classList.add('hidden');
        document.getElementById('mainMenu').classList.remove('hidden');
    }

    function showForm() {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('formPage').classList.remove('hidden');
    }

    function logout() {
        currentSession = { nrp: "", nama: "", role: "" };
        document.getElementById('userInfo').innerText = 'Aplikasi Internal Denma Paspampres';
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('formPage').classList.add('hidden');
        document.getElementById('dataPage').classList.add('hidden');
        document.getElementById('loginCard').classList.remove('hidden');
        document.getElementById('loginForm').reset();
    }

    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
</script>
</body>
</html>
