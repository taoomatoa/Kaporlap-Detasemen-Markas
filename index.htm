<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pendataan Kaporlap</title>
    <style>
        :root {
            --primary-color: #00A8FF;
            --secondary-color: #0077B6;
            --bg-color: #E0F7FA;
            --card-bg: #FFFFFF;
            --text-color: #023E8A;
            --success-color: #2e7d32;
            --danger-color: #c62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .header h2 { font-size: 1.2rem; margin-bottom: 5px; }
        .content { padding: 20px; flex: 1; }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #BEE3F8;
            margin-bottom: 15px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-color); font-weight: 600; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #90E0EF; border-radius: 8px; font-size: 0.95rem; outline: none; }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-sm { padding: 6px 12px; font-size: 0.8rem; width: auto; }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-outline { background-color: transparent; color: var(--primary-color); border: 2px solid var(--primary-color); margin-top: 10px; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .menu-item {
            background: #E0F7FA;
            border: 1px solid #90E0EF;
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            color: var(--text-color);
            font-weight: bold;
            font-size: 0.85rem;
        }

        .tab-menu { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-menu button {
            flex: 1;
            padding: 10px 5px;
            border: 1px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .tab-menu button.active { background: var(--primary-color); color: white; }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }
        .badge-success { background-color: var(--success-color); }
        .badge-danger { background-color: var(--danger-color); }

        .hidden { display: none !important; }
        .user-info { font-size: 0.85rem; opacity: 0.9; }

        /* Member Card Admin */
        .member-card {
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            background: #FAFAFA;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Toast Notification */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 380px; width: calc(100% - 40px); }
        .toast { padding: 12px 16px; border-radius: 8px; background: #333; color: white; margin-bottom: 8px; opacity: 0; transition: opacity 0.3s; font-size: 0.85rem; }
        .toast.show { opacity: 1; }
        .toast-success { background: var(--success-color); }
        .toast-error { background: var(--danger-color); }
    </style>
</head>
<body>

<div id="toast-container" class="toast-container"></div>

<div class="mobile-container">
    <div class="header">
        <h2>PENDATAAN KAPORLAP</h2>
        <div id="userInfo" class="user-info">Aplikasi Internal Denma Paspampres</div>
    </div>

    <div class="content">
        <!-- 1. Form Login -->
        <div id="loginCard" class="card">
            <h3 style="color: var(--text-color); margin-bottom: 15px; text-align: center;">Login Sistem</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginNrp">NRP / Username</label>
                    <input type="text" id="loginNrp" class="form-control" placeholder="Masukkan NRP" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan Password" required>
                </div>
                <button type="submit" id="btnLogin" class="btn">MASUK</button>
            </form>
        </div>
        
        <!-- 2. DASHBOARD ADMIN (Lengkap dengan Pencarian & Refresh) -->
        <div id="adminPanel" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--text-color); font-size: 1.1rem;">Kontrol Pengambilan</h3>
                <!-- Tombol Refresh Data -->
                <button type="button" class="btn btn-sm" onclick="loadAdminData()" style="width: auto; background-color: var(--secondary-color);">🔄 Refresh</button>
            </div>
            
            <!-- Input Pencarian (Filter NRP / Nama) -->
            <div class="form-group" style="margin-bottom: 12px;">
                <input type="text" id="adminSearchInput" class="form-control" placeholder="🔍 Cari NRP atau Nama..." onkeyup="filterAdminList()">
            </div>

            <div class="tab-menu">
                <button id="tabBelumBtn" class="active" onclick="switchAdminTab('Belum Diambil')">Belum Mengambil</button>
                <button id="tabSudahBtn" onclick="switchAdminTab('Sudah Diambil')">Sudah Mengambil</button>
            </div>
            
            <div id="adminListContainer">
                <p style="text-align: center; color: #666;">Memuat data...</p>
            </div>
            
            <button class="btn btn-outline" style="margin-top:20px;" onclick="logout()">Keluar (Logout)</button>
        </div>

        <!-- 3. MENU USER / PRAJURIT -->
        <div id="mainMenu" class="hidden">
            <div class="menu-grid">
                <div class="menu-item" onclick="showForm()">
                    <div style="font-size: 1.5rem;">👕</div>
                    <div>Input Ukuran</div>
                </div>
                <div class="menu-item" onclick="loadMyData()">
                    <div style="font-size: 1.5rem;">📋</div>
                    <div>Data & Status Saya</div>
                </div>
            </div>
            <button class="btn btn-outline" style="margin-top:20px;" onclick="logout()">Keluar (Logout)</button>
        </div>

        <!-- 4. Form Input Ukuran -->
        <div id="formPage" class="card hidden">
            <h3 style="color: var(--text-color); margin-bottom: 15px;">Formulir Ukuran Kaporlap</h3>
            <form id="kaporlapForm">
                <div class="form-group">
                    <label for="pangkat">Pangkat</label>
                    <input type="text" id="pangkat" class="form-control" placeholder="Contoh: Serda / Sertu / Kapten" required>
                </div>
                <div class="form-group">
                    <label for="ukuranPDL">Ukuran PDL</label>
                    <select id="ukuranPDL" class="form-control" required>
                        <option value="">-- Pilih Ukuran --</option>
                        <option value="K">K (Kecil)</option>
                        <option value="S">S (Sedang)</option>
                        <option value="B">B (Besar)</option>
                        <option value="EB">EB (Ekstra Besar)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ukuranSepatu">Ukuran Sepatu PDL</label>
                    <input type="number" id="ukuranSepatu" class="form-control" min="38" max="47" placeholder="Contoh: 42" required>
                </div>
                <div class="form-group">
                    <label for="ukuranTopi">Ukuran Topi / Pet / Baret</label>
                    <input type="number" id="ukuranTopi" class="form-control" min="53" max="62" placeholder="Contoh: 57" required>
                </div>
                <div class="form-group">
                    <label for="ukuranSepatuOlahraga">Ukuran Sepatu Olah Raga</label>
                    <input type="number" id="ukuranSepatuOlahraga" class="form-control" min="38" max="47" placeholder="Contoh: 42" required>
                </div>
                <div class="form-group">
                    <label for="ukuranPDHS">Ukuran PDHS</label>
                    <select id="ukuranPDHS" class="form-control" required>
                        <option value="">-- Pilih Ukuran --</option>
                        <option value="K">K (Kecil)</option>
                        <option value="S">S (Sedang)</option>
                        <option value="L">L (Besar)</option>
                        <option value="XL">XL (Ekstra Besar)</option>
                    </select>
                </div>
                <button type="submit" class="btn">SIMPAN DATA</button>
                <button type="button" class="btn btn-outline" onclick="showMenu()">KEMBALI</button>
            </form>
        </div>

        <!-- 5. Halaman Tampilan Data & Status User -->
        <div id="dataPage" class="card hidden">
            <h3 style="color: var(--text-color); margin-bottom: 15px;">Status & Ukuran Saya</h3>
            <div id="userStatusContainer" style="margin-bottom: 15px;"></div>
            <div id="dataContainer"></div>
            <button type="button" class="btn btn-outline" style="margin-top: 15px;" onclick="showMenu()">KEMBALI KE MENU</button>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1C7rkiCGI7Y5Mt6w2PWZWNrdXwOMiM3wa4r5RmiSKijmusbYNrqaNJmgyHBfgtHFf/exec";
    let currentSession = { nrp: "", nama: "", role: "" };
    let allAdminData = [];
    let currentAdminFilter = "Belum Diambil";


    

    // Event Listener
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
    document.getElementById('kaporlapForm').addEventListener('submit', handleSimpanUkuran);

    async function postToAppsScript(payload) {
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        return await response.json();
    }

    // Process Login
    async function handleLogin(e) {
        e.preventDefault();
        const nrp = document.getElementById('loginNrp').value.trim();
        const password = document.getElementById('loginPassword').value;

        try {
            const result = await postToAppsScript({ action: 'login', nrp: nrp, password: password });

            if (result.status === 'success') {
                currentSession.nrp = nrp;
                currentSession.nama = result.nama;
                currentSession.role = result.role;

                document.getElementById('userInfo').innerText = `${result.nama} (${result.role})`;
                showToast('Login berhasil!', 'success');

                document.getElementById('loginCard').classList.add('hidden');

                if (result.role === 'Admin') {
                    document.getElementById('adminPanel').classList.remove('hidden');
                    loadAdminData();
                } else {
                    showMenu();
                }
            } else {
                showToast(result.message, 'error');
            }
        } catch (err) {
            showToast('Gagal terhubung ke server!', 'error');
        }
    }

    // Global variable untuk menyimpan data & filter
    let allAdminData = [];
    let currentAdminFilter = "Belum Diambil";

    // Function Admin: Load Data Anggota
    async function loadAdminData() {
        const container = document.getElementById('adminListContainer');
        container.innerHTML = '<p style="text-align: center; color: #666;">Memuat data terbaru...</p>';

        try {
            const res = await postToAppsScript({ action: 'get_status_admin' });
            if (res.status === 'success') {
                allAdminData = res.data;
                renderAdminList();
            } else {
                container.innerHTML = '<p style="text-align: center; color: red;">Gagal mengambil data.</p>';
            }
        } catch (err) {
            container.innerHTML = '<p style="text-align: center; color: red;">Gagal memuat data dari server.</p>';
        }
    }

    // Switch Tab Filter Status
    function switchAdminTab(filter) {
        currentAdminFilter = filter;
        document.getElementById('tabBelumBtn').classList.toggle('active', filter === 'Belum Diambil');
        document.getElementById('tabSudahBtn').classList.toggle('active', filter === 'Sudah Diambil');
        renderAdminList();
    }

    // Live Filter dari Input Search
    function filterAdminList() {
        renderAdminList();
    }

    // Render Anggota Berdasarkan Tab & Input Pencarian
    function renderAdminList() {
        const container = document.getElementById('adminListContainer');
        const searchQuery = document.getElementById('adminSearchInput').value.toLowerCase().trim();

        // Filter berdasarkan Status + Keyword (NRP / Nama)
        const filtered = allAdminData.filter(item => {
            const matchStatus = item.status === currentAdminFilter;
            const matchQuery = item.nrp.toString().toLowerCase().includes(searchQuery) || 
                               item.nama.toLowerCase().includes(searchQuery);
            return matchStatus && matchQuery;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #888; margin: 20px 0;">Tidak ada data yang cocok.</p>`;
            return;
        }

        let html = '';
        filtered.forEach(item => {
            const isSudah = item.status === "Sudah Diambil";
            html += `
                <div class="member-card">
                    <div>
                        <div style="font-weight: bold; color: var(--text-color);">${item.nama}</div>
                        <div style="font-size: 0.8rem; color: #666;">NRP: <strong>${item.nrp}</strong> | ${item.pangkat}</div>
                        ${isSudah ? `<div style="font-size: 0.75rem; color: #333; margin-top:2px;">Petugas: ${item.petugas} (${item.tglDiambil})</div>` : ''}
                    </div>
                    <div>
                        ${isSudah 
                            ? `<button class="btn btn-sm btn-danger" onclick="toggleStatus('${item.nrp}', 'Belum Diambil')">Batalkan</button>`
                            : `<button class="btn btn-sm btn-success" onclick="toggleStatus('${item.nrp}', 'Sudah Diambil')">Set Diambil</button>`
                        }
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // Render Anggota Berdasarkan Tab Admin
    function renderAdminList() {
        const container = document.getElementById('adminListContainer');
        const filtered = allAdminData.filter(item => item.status === currentAdminFilter);

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #888; margin: 20px 0;">Tidak ada anggota yang ${currentAdminFilter.toLowerCase()}.</p>`;
            return;
        }

        let html = '';
        filtered.forEach(item => {
            const isSudah = item.status === "Sudah Diambil";
            html += `
                <div class="member-card">
                    <div>
                        <div style="font-weight: bold; color: var(--text-color);">${item.nama}</div>
                        <div style="font-size: 0.8rem; color: #666;">NRP: ${item.nrp} | ${item.pangkat}</div>
                        ${isSudah ? `<div style="font-size: 0.75rem; color: #333; margin-top:2px;">Petugas: ${item.petugas} (${item.tglDiambil})</div>` : ''}
                    </div>
                    <div>
                        ${isSudah 
                            ? `<button class="btn btn-sm btn-danger" onclick="toggleStatus('${item.nrp}', 'Belum Diambil')">Batalkan</button>`
                            : `<button class="btn btn-sm btn-success" onclick="toggleStatus('${item.nrp}', 'Sudah Diambil')">Set Diambil</button>`
                        }
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // Admin Toggle Status Pengambilan (Ubah status Pengambilan Anggota)
    async function toggleStatus(targetNrp, newStatus) {
        try {
            showToast('Memproses...', 'info');
            const res = await postToAppsScript({
                action: 'update_status_pengambilan',
                targetNrp: targetNrp,
                newStatus: newStatus,
                adminName: currentSession.nama
            });

            if (res.status === 'success') {
                showToast(res.message, 'success');
                loadAdminData(); // Refresh Data Admin
            } else {
                showToast(res.message, 'error');
            }
        } catch (err) {
            showToast('Gagal mengubah status', 'error');
        }
    }

    // Save Ukuran Form
    async function handleSimpanUkuran(e) {
        e.preventDefault();
        const payload = {
            action: 'simpan_kaporlap',
            nrp: currentSession.nrp,
            nama: currentSession.nama,
            pangkat: document.getElementById('pangkat').value,
            ukuranPDL: document.getElementById('ukuranPDL').value,
            ukuranSepatu: document.getElementById('ukuranSepatu').value,
            ukuranTopi: document.getElementById('ukuranTopi').value,
            ukuranSepatuOlahraga: document.getElementById('ukuranSepatuOlahraga').value,
            ukuranPDHS: document.getElementById('ukuranPDHS').value
        };

        try {
            const res = await postToAppsScript(payload);
            if (res.status === 'success') {
                showToast(res.message, 'success');
                document.getElementById('kaporlapForm').reset();
                showMenu();
            }
        } catch (err) {
            showToast('Gagal menyimpan data!', 'error');
        }
    }

    // User: Load Status & Ukuran Saya
    async function loadMyData() {
        showDisplayPage();
        const container = document.getElementById('dataContainer');
        const statusContainer = document.getElementById('userStatusContainer');
        container.innerHTML = '<p style="text-align:center; color:#666;">Memuat data...</p>';

        try {
            const res = await postToAppsScript({ action: 'get_my_data', nrp: currentSession.nrp });
            if (res.status === 'success') {
                // Render Status Pengambilan
                const st = res.statusInfo;
                const isSudah = st.status === "Sudah Diambil";
                statusContainer.innerHTML = `
                    <div style="padding: 12px; border-radius: 8px; background: ${isSudah ? '#E8F5E9' : '#FFEBEE'}; border: 1px solid ${isSudah ? '#A5D6A7' : '#EF9A9A'};">
                        <div style="font-size:0.85rem;">Status Pengambilan Kaporlap:</div>
                        <span class="status-badge ${isSudah ? 'badge-success' : 'badge-danger'}">${st.status}</span>
                        ${isSudah ? `<div style="font-size:0.75rem; margin-top:5px; color:#555;">Diambil: ${st.tglDiambil}<br>Petugas: ${st.petugas}</div>` : ''}
                    </div>
                `;

                // Render Riwayat Ukuran
                if (res.data.length > 0) {
                    let html = '';
                    res.data.forEach((item) => {
                        html += `
                            <div style="border: 1px solid #90E0EF; border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #F0F9FF;">
                                <div style="font-size:0.75rem; color:#0077B6;">📅 ${item.timestamp}</div>
                                <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:0.85rem; margin-top:5px;">
                                    <div><strong>PDL:</strong> ${item.ukuranPDL}</div>
                                    <div><strong>Sepatu PDL:</strong> ${item.ukuranSepatu}</div>
                                    <div><strong>Topi:</strong> ${item.ukuranTopi}</div>
                                    <div><strong>Sepatu OR:</strong> ${item.ukuranSepatuOlahraga}</div>
                                    <div><strong>PDHS:</strong> ${item.ukuranPDHS}</div>
                                </div>
                            </div>`;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="text-align:center; color:#888;">Belum ada data ukuran tersimpan.</p>';
                }
            }
        } catch (err) {
            container.innerHTML = '<p style="text-align:center; color:red;">Gagal memuat data.</p>';
        }
    }

    // Navigasi Tampilan
    function showDisplayPage() {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('formPage').classList.add('hidden');
        document.getElementById('dataPage').classList.remove('hidden');
    }

    function showMenu() {
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('formPage').classList.add('hidden');
        document.getElementById('dataPage').classList.add('hidden');
        document.getElementById('mainMenu').classList.remove('hidden');
    }

    function showForm() {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('formPage').classList.remove('hidden');
    }

    function logout() {
        currentSession = { nrp: "", nama: "", role: "" };
        document.getElementById('userInfo').innerText = 'Aplikasi Internal Denma Paspampres';
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('formPage').classList.add('hidden');
        document.getElementById('dataPage').classList.add('hidden');
        document.getElementById('loginCard').classList.remove('hidden');
        document.getElementById('loginForm').reset();
    }

    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
</script>
</body>
</html>
